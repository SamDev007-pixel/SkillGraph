<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — SkillGraph</title>
  <meta name="description" content="Register for SkillGraph to track your coding roadmap, flashcards, practice, and mistakes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Toggle Navigation"><i class="bi bi-list"></i></button>
        <a href="index.html" class="brand-link">
          <div class="brand-icon"><i class="bi bi-graph-up-arrow"></i></div>
          <div class="brand-text">
            <span class="brand-name">SkillGraph</span>
            <span class="brand-sub">CODING PRACTICE PLATFORM</span>
          </div>
        </a>
      </div>
      <nav class="header-nav" id="header-nav">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="roadmap.html" class="nav-link">Roadmap</a>
        <a href="flashcards.html" class="nav-link">Flashcards</a>
        <a href="practice.html" class="nav-link">Practice</a>
        <a href="mistakes.html" class="nav-link">Mistakes</a>
        <a href="progress.html" class="nav-link">Progress</a>
      </nav>
      <div class="header-right">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <h2 class="fw-bold mb-1">Create Account</h2>
        <p class="small text-secondary mb-0">Start tracking your preparation milestones today.</p>
      </div>

      <form id="register-form">
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="name" placeholder="Alex Morgan" required autocomplete="name">
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="student@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label mb-1">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Create a password" required autocomplete="new-password">
          </div>
        </div>

        <div class="mb-3">
          <label for="confirm-password" class="form-label mb-1">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
            <input type="password" class="form-control" id="confirm-password" placeholder="Re-enter password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 justify-content-center py-2 mb-3">Create Account</button>

        <p class="text-center small mb-0">Already have an account? <a href="login.html" class="fw-bold">Sign In</a></p>
      </form>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

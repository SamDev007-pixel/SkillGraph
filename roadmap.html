<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Roadmap — SkillGraph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Toggle Navigation"><i class="bi bi-list"></i></button>
        <a href="index.html" class="brand-link">
          <div class="brand-icon"><i class="bi bi-graph-up-arrow"></i></div>
          <div class="brand-text">
            <span class="brand-name">SkillGraph</span>
            <span class="brand-sub">CODING PRACTICE PLATFORM</span>
          </div>
        </a>
      </div>
      <nav class="header-nav" id="header-nav">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="roadmap.html" class="nav-link active">Roadmap</a>
        <a href="flashcards.html" class="nav-link">Flashcards</a>
        <a href="practice.html" class="nav-link">Practice</a>
        <a href="mistakes.html" class="nav-link">Mistakes</a>
        <a href="progress.html" class="nav-link">Progress</a>
      </nav>
      <div class="header-right">
        <button class="btn btn-outline btn-sm logout-btn auth-only" type="button">Sign Out</button>
        <a href="login.html" class="btn btn-primary btn-sm guest-only" style="display:none;">Sign In</a>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="main-container">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
          <h2 class="fw-bold mb-1">Learning Roadmap</h2>
          <p class="text-secondary mb-0">Check off daily tasks across 12 structured programming tracks.</p>
        </div>
        <div>
          <span class="badge badge-starter me-2">Core</span>
          <span class="badge badge-custom">Custom</span>
        </div>
      </div>
      <div id="roadmap-accordion">
        <div class="text-center py-5"><div class="spinner-border text-warning" role="status"></div></div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="addTopicModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-add-topic">
          <div class="modal-header"><h5 class="modal-title fw-bold">Add Custom Topic</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="hidden" id="add-topic-track-id">
            <div class="mb-2"><span class="small text-secondary">Track: </span><strong id="add-topic-track-name"></strong></div>
            <div class="mb-3"><label class="form-label">Topic Title</label><input type="text" class="form-control" id="add-topic-title" required></div>
            <div class="mb-3"><label class="form-label">Description (Optional)</label><textarea class="form-control" id="add-topic-desc" rows="2"></textarea></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Add Topic</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editTopicModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-edit-topic">
          <div class="modal-header"><h5 class="modal-title fw-bold">Edit Topic</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="hidden" id="edit-topic-id">
            <div class="mb-3"><label class="form-label">Topic Title</label><input type="text" class="form-control" id="edit-topic-title" required></div>
            <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="edit-topic-desc" rows="2"></textarea></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save Changes</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-add-task">
          <div class="modal-header"><h5 class="modal-title fw-bold">Add Subtask</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="hidden" id="add-task-topic-id" name="topic_id">
            <div class="mb-2"><span class="small text-secondary">Topic: </span><strong id="add-task-topic-name"></strong></div>
            <div class="mb-3"><label class="form-label">Subtask Title</label><input type="text" class="form-control" id="add-task-title" name="title" required></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Add Task</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-edit-task">
          <div class="modal-header"><h5 class="modal-title fw-bold">Edit Subtask</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="hidden" id="edit-task-id">
            <div class="mb-3"><label class="form-label">Subtask Title</label><input type="text" class="form-control" id="edit-task-title" required></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save Changes</button></div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
